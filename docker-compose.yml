version: '3.8'

services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    ports:
      - "1984:1984"  # Web UI and API
      - "8554:8554"  # RTSP server
      - "8555:8555/tcp"  # WebRTC
      - "8555:8555/udp"  # WebRTC
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    environment:
      - CAMERA_USER=${CAMERA_USER}
      - CAMERA_PASSWORD=${CAMERA_PASSWORD}
      - CAMERA1_IP=${CAMERA1_IP}
      - CAMERA2_IP=${CAMERA2_IP}
    restart: unless-stopped
    networks:
      - camera-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1984/api/streams"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    image: nginx:alpine
    container_name: camera-web
    ports:
      - "8082:80"  # Camera viewer web interface
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - camera-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  camera-net:
    driver: bridge
