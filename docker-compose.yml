networks:
  camera-net:
    driver: bridge
services:
  api:
    build: ./api
    container_name: splitcam_api
    depends_on:
    - go2rtc
    environment:
    - TZ=Asia/Jerusalem
    networks:
    - camera-net
    restart: unless-stopped
    volumes:
    - ./recordings:/recordings
    - ./docker-compose.yml:/workspace/docker-compose.yml
    - ./cleanup-recordings.sh:/workspace/cleanup-recordings.sh
    - /var/run/docker.sock:/var/run/docker.sock
  cleanup:
    command: sh -c "while true; do sh /cleanup-recordings.sh; sleep 3600; done"
    container_name: splitcam_cleanup
    image: alpine:latest
    networks:
    - camera-net
    restart: unless-stopped
    volumes:
    - ./recordings:/recordings
    - ./cleanup-recordings.sh:/cleanup-recordings.sh
  go2rtc:
    container_name: splitcam_go2rtc
    environment:
    - CAMERA_USER=${CAMERA_USER}
    - CAMERA_PASSWORD=${CAMERA_PASSWORD}
    - CAMERA1_IP=${CAMERA1_IP}
    - CAMERA2_IP=${CAMERA2_IP}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:1984/api/streams
      timeout: 10s
    image: alexxit/go2rtc:latest
    networks:
    - camera-net
    ports:
    - 1984:1984
    - 8554:8554
    - 8555:8555/tcp
    - 8555:8555/udp
    restart: unless-stopped
    volumes:
    - ./go2rtc.yaml:/config/go2rtc.yaml
    - ./recordings:/recordings
  recorder-camera1:
    command: -rtsp_transport tcp -i rtsp://go2rtc:8554/camera1 -c:v copy -c:a aac
      -b:a 128k -f segment -segment_time 600 -segment_atclocktime 1 -strftime 1 -reset_timestamps
      1 /recordings/%Y-%m-%d_%H-%M-%S.mp4
    container_name: splitcam_recorder_camera1
    depends_on:
    - go2rtc
    environment:
    - TZ=Asia/Jerusalem
    image: linuxserver/ffmpeg:latest
    networks:
    - camera-net
    restart: unless-stopped
    volumes:
    - ./recordings/camera1:/recordings
  recorder-camera2:
    command: -rtsp_transport tcp -i rtsp://go2rtc:8554/camera2 -c:v copy -c:a aac
      -b:a 128k -f segment -segment_time 600 -segment_atclocktime 1 -strftime 1 -reset_timestamps
      1 /recordings/%Y-%m-%d_%H-%M-%S.mp4
    container_name: splitcam_recorder_camera2
    depends_on:
    - go2rtc
    environment:
    - TZ=Asia/Jerusalem
    image: linuxserver/ffmpeg:latest
    networks:
    - camera-net
    restart: unless-stopped
    volumes:
    - ./recordings/camera2:/recordings
  web:
    container_name: splitcam_camera-web
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 5s
      test:
      - CMD-SHELL
      - wget --spider --quiet http://127.0.0.1/ || exit 1
      timeout: 5s
    image: nginx:alpine
    networks:
    - camera-net
    ports:
    - 8082:80
    restart: unless-stopped
    volumes:
    - ./index.html:/usr/share/nginx/html/index.html:ro
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
